name: Product Service CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ProductsService.Api/**'
      - 'ProductService.Application/**'
      - 'ProductService.Domain/**'
      - 'ProductService.Infrastructure/**'
      - 'Shared.Contracts/**'
      - 'ProductService.UnitTests/**'
      - 'ProductService.IntegrationTests/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'ProductsService.Api/**'
      - 'ProductService.Application/**'
      - 'ProductService.Domain/**'
      - 'ProductService.Infrastructure/**'
      - 'Shared.Contracts/**'
      - 'ProductService.UnitTests/**'
      - 'ProductService.IntegrationTests/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Product Service Dependencies
        run: |
            dotnet restore ProductsService.Api/ProductsService.Api.csproj
            dotnet restore ProductService.UnitTests/ProductService.UnitTests.csproj
            dotnet restore ProductService.IntegrationTests/ProductService.IntegrationTests.csproj

      - name: Build Project
        # env:
        #   ConnectionStrings__DefaultConnection: ${{ secrets.ConnectionStrings__DefaultConnection }}
        #   Serilog__WriteTo__1__Args__connectionString: ${{ secrets.Serilog__WriteTo__1__Args__connectionString }}
        run: |
            dotnet build ProductsService.Api/ProductsService.Api.csproj --no-restore --configuration Release
            dotnet build ProductService.UnitTests/ProductService.UnitTests.csproj --no-restore --configuration Release
            dotnet build ProductService.IntegrationTests/ProductService.IntegrationTests.csproj --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test ProductService.UnitTests/ProductService.UnitTests.csproj --configuration Release --no-build --verbosity normal
      
      - name: Run Integration Tests
        run: dotnet test ProductService.IntegrationTests/ProductService.IntegrationTests.csproj --configuration Release --no-build --verbosity normal

  docker-build-and-push:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ProductsService.Api/Dockerfile 
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/product-service:latest

  deploy-to-render:
    needs: docker-build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST "${{ secrets.RENDER_PRODUCT_DEPLOY_HOOK }}"