name: Product Service CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ProductService.Api/**'
      - 'ProductService.Application/**'
      - 'ProductService.Domain/**'
      - 'ProductService.Infrastructure/**'
      - 'Shared.Contracts/**'
      - 'ProductService.UnitTests/**'
      - '.github/workflows/product-service-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'ProductService.Api/**'
      - 'ProductService.Application/**'
      - 'ProductService.Domain/**'
      - 'ProductService.Infrastructure/**'
      - 'Shared.Contracts/**'
      - 'ProductService.UnitTests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/product-service

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build --no-restore --configuration Release
      
      - name: Run Unit Tests
        run: dotnet test ProductService.UnitTests/ProductService.UnitTests.csproj --configuration Release --no-build --verbosity normal

  ghcr-build-and-push:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ProductService.Api/Dockerfile 
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update GitOps Helm Values in Manifests Repo
        env:
          GH_PAT: ${{ secrets.GITOPS_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git clone https://x-access-token:${{ env.GH_PAT }}@github.com/Yar-Zar/K8s-Manifests-Repository.git manifests-repo
          cd manifests-repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          VALUES_PATH="apps/values/product-service-values.yaml"

          if [ -f "$VALUES_PATH" ]; then
            sed -i 's/tag: .*/tag: "'${{ env.COMMIT_SHA }}'"/g' "$VALUES_PATH"
            git add "$VALUES_PATH"
            if ! git diff --cached --quiet; then
              git commit -m "chore(gitops): update product-service image tag to ${{ env.COMMIT_SHA }}"
              git push origin main
              echo "Successfully updated product-service values!"
            else
              echo "No changes to commit"
            fi
          else
            echo "Error: Values file not found at $VALUES_PATH"
            exit 1
          fi