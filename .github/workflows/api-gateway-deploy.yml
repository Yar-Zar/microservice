name: API Gateway CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ApiGateway/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'ApiGateway/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore ApiGateway/ApiGateway.csproj

      - name: Build Project
        run: dotnet build ApiGateway/ApiGateway.csproj --no-restore --configuration Release

  docker-build-and-push:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ApiGateway/Dockerfile 
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest
          build-args: |
            ReverseProxy__Clusters__product-cluster__Destinations__destination1__Address=${{ secrets.PRODUCT_SERVICE_URL }}
            ReverseProxy__Clusters__order-cluster__Destinations__destination1__Address=${{ secrets.ORDER_SERVICE_URL }}
            ReverseProxy__Clusters__payment-cluster__Destinations__destination1__Address=${{ secrets.PAYMENT_SERVICE_URL }}
            ReverseProxy__Clusters__user-cluster__Destinations__destination1__Address=${{ secrets.USER_SERVICE_URL }}

  deploy-to-render:
    needs: docker-build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST "${{ secrets.RENDER_API_GATEWAY_DEPLOY_HOOK }}"